[workspace]
resolver = "3"
members = [
  "crates/clickman-protocol",
  "crates/clickman-core",
  "crates/clickman-ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["LockVoid Labs"]
repository = "https://github.com/lockvoid/clickman"

[workspace.dependencies]
clickman-protocol = { path = "crates/clickman-protocol" }
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
strip = "symbols"
