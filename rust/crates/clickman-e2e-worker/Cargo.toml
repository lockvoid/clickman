[package]
name = "clickman-e2e-worker"
description = "Drives the Rust ClickMan client for the end-to-end suite: JSON commands on stdin, one JSON answer per line on stdout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
clickman.workspace = true
log = { version = "0.4", features = ["std"] }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
